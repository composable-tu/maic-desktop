[package]
name = "maic-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
# macos-private-api: enables the HTML Fullscreen API (requestFullscreen) in
# WKWebView via the private fullScreenEnabled preference. The web app uses
# it for presentation mode. No-op on Windows/Linux.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
