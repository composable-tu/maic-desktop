[package]
name = "maic-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
# macos-private-api: enables the HTML Fullscreen API (requestFullscreen) in
# WKWebView via the private fullScreenEnabled preference. The web app uses
# it for presentation mode. No-op on Windows/Linux.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# RtlGetVersion (Wdk_System_SystemServices) is the only Windows API that
# reports the true OS version; used for the splash footer label. Its
# signature pulls OSVERSIONINFOW from Win32_System_SystemInformation.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

# sysctlbyname("kern.osproductversion") is what `sw_vers` reads underneath;
# fetched directly from libSystem, no process spawn. Already a transitive
# dependency, so this costs nothing.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
