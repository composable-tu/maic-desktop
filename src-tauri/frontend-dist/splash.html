<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAIC Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --h1-size: clamp(20px, 5.5vw, 28px);
        --status-size: clamp(13px, 3.5vw, 15px);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden;
        background: #000;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-user-select: none; user-select: none;
        position: relative;
        display: flex; flex-direction: column; align-items: center;
      }
      .content {
        width: 100%; margin: auto 0;
        display: flex; align-items: center; justify-content: center;
        gap: clamp(16px, 5vw, 28px); padding: 0 clamp(24px, 8vw, 48px);
      }
      body.has-error .content { margin: clamp(10px, 3vh, 20px) 0 0 0; }
      body.has-error .line { height: clamp(24px, 12vh, 40px); }
      .logo img { width: 100%; height: 100%; }
      .logo {
        width: clamp(48px, 14vw, 72px); height: clamp(48px, 14vw, 72px); flex: none;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
      }
      .line {
        width: 3px; flex: none; height: clamp(72px, 40vh, 160px); align-self: center;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden; position: relative;
      }
      .line > div {
        position: absolute; left: 0; right: 0; top: 0;
        height: clamp(20px, 26%, 46px);
        border-radius: 1px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 45%, rgba(255, 255, 255, 0.98) 100%);
        animation: slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .line > div::after {
        content: ""; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
        width: 20px; height: 20px; border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, 0.6) 30%, rgba(255, 255, 255, 0.15) 60%, transparent 72%);
        filter: blur(2px);
      }
      @keyframes slide {
        0% { top: -60px; }
        100% { top: 100%; }
      }
      .line.done > div {
        animation: none; top: 0; bottom: 0; height: auto;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), #fff);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }
      .line.done > div::after { display: none; }
      .text {
        min-width: 0; margin-left: clamp(5px, 1.5vw, 10px); position: relative;
        /* The unit centred against the logo is title + ONE subtitle line, held
           open even when the subtitle wraps: wrapping then only grows downward,
           so nothing shifts, while the pair still reads as one balanced block. */
        height: calc(var(--h1-size) * 1.15 + var(--status-size) * 1.2);
      }
      h1 {
        font-size: var(--h1-size); margin: 0; font-weight: 600;
        letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap;
      }
      #status {
        font-size: var(--status-size); color: #888;
        /* Out of flow, in the reserved line under the title. Fixed width so a
           long stage wraps instead of sliding the centred row. */
        position: absolute; top: calc(var(--h1-size) * 1.15); left: 0;
        margin-top: 4px;
        width: clamp(140px, 37.3vw, 190px);
      }
      /* Status lines used to hard-cut; a short rise-in makes the swap read as
         progress rather than a flicker. */
      @keyframes statusIn { from { opacity: 0; transform: translateY(4px); } }
      #status.in { animation: statusIn 180ms ease-out; }
      #error {
        display: none;
        flex: 1 1 auto; min-height: 0;
        width: 90%; margin: 8px clamp(24px, 8vw, 48px) 20px;
        text-align: left; font-size: 12px;
        border: 1px solid rgba(242, 19, 97, 0.3); border-radius: 6px;
        padding: 10px 12px; overflow: auto;
        white-space: pre-wrap; -webkit-user-select: text; user-select: text;
        color: #f21361; background: rgba(242, 19, 97, 0.06);
      }
      #error.show { display: block; }
      .footer {
        position: absolute; left: 0; right: 0; bottom: 6px;
        /* Same side gutter as the error panel, so both corners line up. */
        display: flex; justify-content: space-between; gap: 16px;
        padding: 0 clamp(24px, 8vw, 24px);
        font-size: 10px; line-height: 1; letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>

          probing: '启动 :{port} 并探活',
          failed: '启动失败',
          brand: '非官方 OpenMAIC Desktop'
        }
      };
      function pickLang(declared) {
        return /^zh/i.test(declared || '') ? 'zh' : 'en';
      }
      var LANG = pickLang(navigator.language);
      var T = Object.assign({}, STRINGS.en, STRINGS[LANG]);
      document.documentElement.lang = LANG === 'zh' ? 'zh-Hans' : 'en';
      document.getElementById('brand').textContent = T.brand;

      var statusEl = document.getElementById('status');
      window.__maicStatus = function (key, port) {
        var msg = (T[key] || key).replace('{port}', port || '');
        if (statusEl.textContent === msg) return;
        statusEl.textContent = msg;
        statusEl.classList.remove('in');
        void statusEl.offsetWidth; // reflow, so the next push replays the animation
        statusEl.classList.add('in');
      };
      // Resolve the shipping line through the dictionary, so the markup's
      // English default is replaced before the first paint.
      window.__maicStatus('checking');
      window.__maicTarget = function (text) {
        document.getElementById('target').textContent = text;
      };
      window.__maicFatal = function (message) {
        document.body.classList.add('has-error');
        window.__maicStatus('failed');
        document.getElementById('bar').classList.add('done');
        var el = document.getElementById('error');
        el.textContent = message;
        el.classList.add('show');
      };
    </script>
  </body>
</html>
