name: desktop-build

# Full 4-platform desktop builds. Artifacts only (90-day retention), no releases.
#
# Cost note: the matrix fans out to 2 macOS + 2 Windows runners, each doing a
# full Next build + Node download + Rust compile. It runs on main pushes whose
# head commit message starts with [build], plus manual dispatch — ordinary
# main pushes are covered by the cheap Linux smoke job in desktop-check.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Skip unless the head commit asks for a full build. Keeps `main` pushes
    # cheap by default; use a `[build] ...` message (or Run workflow) for
    # real installers.
    if: startsWith(github.event.head_commit.message, '[build]') || github.event_name == 'workflow_dispatch'
    # Matrix-aware group (job-level, so `matrix` is in scope): a shared
    # top-level group with cancel-in-progress makes parallel platform
    # jobs cancel each other. New pushes supersede only the same-target run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mac-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: mac-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: win-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install wrapper deps
        run: pnpm install --frozen-lockfile

      # Tauri's beforeBuildCommand runs `pnpm prepare:server`, which bundles
      # the TS build script, builds the submodule, stages the server tarball
      # and downloads the matching Node sidecar for the runner's native
      # target — no extra step needed here.
      - name: Tauri build
        run: pnpm tauri build

      - name: Show build provenance
        run: cat src-tauri/resources/server/.build-meta.json

      - name: Upload installers (90 days)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maic-desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/**/*
          retention-days: 90
          if-no-files-found: error
