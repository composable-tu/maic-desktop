name: desktop-build

# Full 4-platform desktop builds. Artifacts only (90-day retention), no releases.
# Tags like desktop-v* are build triggers only — nothing is published to Releases.

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    # Matrix-aware group (job-level, so `matrix` is in scope): a shared
    # top-level group with cancel-in-progress makes parallel platform
    # jobs cancel each other. New pushes supersede only the same-target run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mac-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: mac-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: win-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install wrapper deps
        run: pnpm install --frozen-lockfile

      # Tauri's beforeBuildCommand runs `node scripts/prepare-server.mjs`,
      # which builds the submodule, stages the server tarball and downloads
      # the matching Node sidecar for the runner's native target — no extra
      # step needed here.
      - name: Show build provenance
        run: echo "(populated by beforeBuildCommand during tauri build)"

      - name: Tauri build
        run: pnpm tauri build

      - name: Show build provenance
        run: cat src-tauri/resources/server/.build-meta.json

      - name: Upload installers (90 days)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maic-desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/**/*
          retention-days: 90
          if-no-files-found: error
