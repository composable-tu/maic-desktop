name: desktop-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/desktop-*.yml"

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install wrapper deps
        run: pnpm install --frozen-lockfile

      # Full prepare (incl. Node sidecar download): tauri-build validates
      # that every externalBin file exists, even for --no-bundle smoke builds.
      - name: Prepare server (build submodule + stage sidecar)
        run: node scripts/prepare-server.mjs --target x86_64-unknown-linux-gnu

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (no bundle, smoke only)
        run: pnpm tauri build --no-bundle
        env:
          TAURI_PRIVATE_KEY: ""
          TAURI_KEY_PASSWORD: ""
